name: Timezone-Aware Cloud Outreach Scheduler

on:
  schedule:
    # Sweeps every 30 minutes from 02:00 UTC to 10:00 UTC (10:00 AM to 6:00 PM MYT) Monday to Friday
    # This automatically catches 10:00 AM local time across Singapore, Vietnam, Thailand, UAE, Qatar, and UK/Europe!
    - cron: '0,30 2-10 * * 1-5'
  workflow_dispatch:

jobs:
  timezone_dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Timezone-Aware Cloud Scheduler
        run: |
          python cloud_scheduler_bot.py

      - name: Commit and Push Ledger State
        run: |
          git config --global user.name "AG-Offshore Timezone Scheduler"
          git config --global user.email "scheduler@ag-offshore.com"
          git add -f schedule_config.json profiles/*/sent_ledger.json
          git commit -m "Auto-update sent ledger from timezone-aware cloud dispatch" || echo "No changes to commit"
          git push origin main || echo "Push failed or nothing to push"
