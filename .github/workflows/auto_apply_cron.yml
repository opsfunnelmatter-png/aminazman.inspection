name: 24/7 Cloud Auto-Apply Campaign Runner

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  run-campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Execute Cloud Dual Account Auto-Apply Bot
        env:
          GMAIL_APP_PASS_1: ${{ secrets.GMAIL_APP_PASS_1 || 'sznpitgpdmhpkvee' }}
          GMAIL_APP_PASS_2: ${{ secrets.GMAIL_APP_PASS_2 || 'djggjmmezbjxofbi' }}
        run: |
          python cloud_auto_apply_bot.py

      - name: Commit and Push Updated CRM Status to Vercel
        run: |
          git config --global user.name " AG-Offshore Cloud Bot\n